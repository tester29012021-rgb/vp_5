<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Весела музична фізкультхвилинка</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2F3640;
            --light: #F7F9FA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8ede0 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        h1 {
            color: var(--dark);
            margin-bottom: 15px;
            font-size: 2rem;
        }

        /* Персонаж та анімації */
        .coach-container {
            margin: 20px 0;
            position: relative;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar {
            font-size: 100px;
            transition: transform 0.3s ease;
            user-select: none;
        }

        /* Анімації вправ */
        .jump {
            animation: jumpAnim 0.6s infinite alternate ease-in-out;
        }
        @keyframes jumpAnim {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        .spin {
            animation: spinAnim 1s infinite linear;
        }
        @keyframes spinAnim {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stretch {
            animation: stretchAnim 1s infinite alternate ease-in-out;
        }
        @keyframes stretchAnim {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(1.3) translateY(-15px); }
        }

        .idle {
            animation: idleAnim 2s infinite ease-in-out;
        }
        @keyframes idleAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Бабл з підказками */
        .speech-bubble {
            background: var(--accent);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--dark);
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-height: 44px;
        }

        /* Таймер */
        .timer {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        /* Кнопки */
        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        @media (min-width: 480px) {
            .buttons-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .btn {
            background-color: var(--secondary);
            border: none;
            padding: 12px 15px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Канвас для салюту */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div class="container">
        <h1>Фізкультхвилинка з Ведмедиком</h1>
        
        <div class="speech-bubble" id="speechText">Привіт! Обери вправу та почнемо розминку! 👋</div>

        <div class="coach-container">
            <div class="avatar idle" id="coachAvatar">🐻</div>
        </div>

        <div class="timer" id="timerDisplay">20</div>

        <div class="buttons-grid">
            <button class="btn" onclick="startExercise('jump', 'Пострибай як зайчик 🐰', 'jump')">Пострибай 🐰</button>
            <button class="btn" onclick="startExercise('spin', 'Покрутися як млин 🌀', 'spin')">Покрутися 🌀</button>
            <button class="btn" onclick="startExercise('stretch', 'Потягнися до сонечка ☀️', 'stretch')">Потягнися ☀️</button>
        </div>
    </div>

    <script>
        let countdown;
        let timeLeft = 20;
        let isRunning = false;

        const coachAvatar = document.getElementById('coachAvatar');
        const timerDisplay = document.getElementById('timerDisplay');
        const speechText = document.getElementById('speechText');
        const buttons = document.querySelectorAll('.btn');

        // Веб-аудіо синтезатор для звуків (не потребує зовнішніх файлів)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(frequency, type, duration) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSuccessSound() {
            setTimeout(() => playBeep(523.25, 'sine', 0.2), 0);   // C5
            setTimeout(() => playBeep(659.25, 'sine', 0.2), 200); // E5
            setTimeout(() => playBeep(783.99, 'sine', 0.3), 400); // G5
            setTimeout(() => playBeep(1046.50, 'triangle', 0.5), 600); // C6
        }

        function startExercise(animationClass, message, exerciseType) {
            if (isRunning) return;
            isRunning = true;
            
            // Вимикаємо кнопки на час вправи
            buttons.forEach(btn => btn.disabled = true);

            timeLeft = 20;
            timerDisplay.textContent = timeLeft;
            speechText.textContent = message;

            // Застосовуємо анімацію до аватарки
            coachAvatar.className = `avatar ${animationClass}`;

            // Таймер зворотного відліку
            countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                
                // Звуковий сигнал на останні секунди
                if (timeLeft > 0 && timeLeft <= 3) {
                    playBeep(440, 'square', 0.1);
                }

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    endExercise();
                }
            }, 1000);
        }

        function endExercise() {
            isRunning = false;
            coachAvatar.className = 'avatar idle';
            speechText.textContent = "Чудова робота! Ти супер! 🎉";
            timerDisplay.textContent = "✨";
            
            buttons.forEach(btn => btn.disabled = false);
            
            playSuccessSound();
            launchFireworks();
        }

        /* Простий і красивий ефект салюту на Canvas */
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // гравітація
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function launchFireworks() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF85A2', '#845EC2'];
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const startX = Math.random() * canvas.width;
                    const startY = Math.random() * (canvas.height / 2);
                    for (let j = 0; j < 50; j++) {
                        particles.push(new Particle(startX, startY, colors[Math.floor(Math.random() * colors.length)]));
                    }
                }, i * 300);
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();
    </script>
</body>
</html>
